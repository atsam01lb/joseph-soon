.wrap::after{
  content:"";
  position:absolute; inset:0;
  background:
    linear-gradient(180deg, rgba(247,246,244,.35) 0%, rgba(247,246,244,.08) 40%, var(--alabaster) 92%),
    radial-gradient(ellipse at 50% 18%, rgba(255,255,255,.5), transparent 62%);
  pointer-events:none;
}
.glow{
  position:absolute; width:60vw; height:60vw; max-width:760px; max-height:760px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(185,179,168,.18), transparent 70%);
  top:38%; left:50%; transform:translate(-50%,-50%);
  animation:glow-pulse 9s ease-in-out infinite;
  pointer-events:none;
}
@keyframes glow-pulse{ 0%,100%{ opacity:.6; transform:translate(-50%,-50%) scale(1);} 50%{ opacity:1; transform:translate(-50%,-50%) scale(1.08);} }

.inner{ position:relative; z-index:2; max-width:640px; }

.logo{
  width:min(180px,42vw);
  margin:0 auto 40px;
  opacity:0; transform:translateY(18px) scale(.96);
  animation:fade-in 1s .1s var(--ease) forwards;
}

.eyebrow{
  font-family:var(--font-body);
  font-size:11px;
  letter-spacing:.36em;
  text-transform:uppercase;
  color:var(--stone);
  font-weight:500;
  display:flex; align-items:center; justify-content:center; gap:12px;
  opacity:0; animation:fade-in 1s .3s var(--ease) forwards;
}
.eyebrow::before,.eyebrow::after{ content:""; width:26px; height:1px; background:var(--pale-stone); }

h1{
  font-family:var(--font-display);
  font-weight:400;
  font-size:clamp(40px,7.2vw,80px);
  line-height:1.05;
  letter-spacing:.01em;
  margin:22px 0 0;
  opacity:0; transform:translateY(24px);
  animation:fade-in 1s .45s var(--ease) forwards;
}
h1 em{ font-style:italic; color:var(--stone); }

.tagline{
  margin:22px auto 0;
  max-width:460px;
  font-size:clamp(14.5px,1.6vw,16.5px);
  font-weight:300;
  line-height:1.75;
  color:var(--ink-soft);
  opacity:0; animation:fade-in 1s .6s var(--ease) forwards;
}

.actions{
  margin-top:38px;
  display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap;
  opacity:0; animation:fade-in 1s .75s var(--ease) forwards;
}
.btn{
  position:relative;
  display:inline-flex; align-items:center; gap:10px;
  padding:16px 32px;
  font-size:12px; letter-spacing:.2em; text-transform:uppercase; font-weight:600;
  border:1px solid var(--ink); color:var(--ink);
  background:transparent;
  border-radius:2px;
  text-decoration:none;
  overflow:hidden; isolation:isolate;
  transition:color .5s var(--ease-soft), border-color .5s var(--ease-soft);
}
.btn::before{
  content:""; position:absolute; inset:0;
  background:var(--ink);
  transform:translateY(101%);
  transition:transform .5s var(--ease-soft);
  z-index:-1;
}
.btn:hover{ color:var(--alabaster); }
.btn:hover::before{ transform:translateY(0); }
.btn svg{ width:16px; height:16px; }

.socials{
  margin-top:34px;
  display:flex; align-items:center; justify-content:center; gap:12px;
  opacity:0; animation:fade-in 1s .9s var(--ease) forwards;
}
.icon-btn{
  width:42px; height:42px; border-radius:50%;
  display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--line); color:var(--ink);
  transition:background .4s var(--ease-soft), color .4s var(--ease-soft), border-color .4s;
}
.icon-btn:hover{ background:var(--ink); color:var(--alabaster); border-color:var(--ink); }
.icon-btn svg{ width:17px; height:17px; }

@keyframes fade-in{ to{ opacity:1; transform:translateY(0) scale(1);} }

.foot{
  position:absolute; left:0; right:0; bottom:26px;
  z-index:2;
  font-size:10.5px; letter-spacing:.1em; color:var(--stone);
  opacity:0; animation:fade-in 1s 1.1s var(--ease) forwards;
}
.foot a{ color:var(--ink); text-decoration:none; border-bottom:1px solid var(--line); transition:border-color .3s; }
.foot a:hover{ border-color:var(--ink); }

@media(max-width:520px){
  .wrap{ padding:36px 20px; }
  .actions{ flex-direction:column; width:100%; }
  .btn{ width:100%; justify-content:center; }
  .foot{ position:static; margin-top:56px; }
}
</style>
